<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky & Branch ASCII</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #80b7e5 0%, #e8f2fa 100%);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #matrix {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      width: 100%;
      height: 100%;
      line-height: 1;
    }

    .char {
      font-family: monospace;
      font-size: 16px;
      display: inline-block;
      width: 9.6px;
      height: 16px;
      text-align: center;
    }

    .branch {
      font-weight: bold;
      color: #1a1a1a;
    }

    .flower {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="matrix"></div>

  <script>
    const matrix = document.getElementById('matrix');
    const CHAR_W = 9.6;
    const CHAR_H = 16;

    // ---------- Branch Skeleton ----------

    function distToSegment(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      const len2 = abx * abx + aby * aby;
      if (len2 === 0) return Math.sqrt(apx * apx + apy * apy);
      let t = (apx * abx + apy * aby) / len2;
      t = Math.max(0, Math.min(1, t));
      const cx = ax + t * abx;
      const cy = ay + t * aby;
      const dx = px - cx;
      const dy = py - cy;
      return Math.sqrt(dx * dx + dy * dy);
    }

    // Recursively build branch segments, also collect flower positions
    function buildSegments(segments, flowers, x, y, angle, length, thickness, depth) {
      if (thickness < 0.003 || length < 0.02) return;

      const endX = x + Math.cos(angle) * length;
      const endY = y + Math.sin(angle) * length;

      // Split segment at midpoint with a slight perpendicular offset for subtle curve
      const midX = (x + endX) / 2;
      const midY = (y + endY) / 2;
      // Tiny perpendicular offset — varies by angle for organic feel, scale by length
      const perpAngle = angle + Math.PI / 2;
      const offset = length * 0.03 * Math.sin(angle * 3 + depth);
      const mx = midX + Math.cos(perpAngle) * offset;
      const my = midY + Math.sin(perpAngle) * offset;

      segments.push({ ax: x, ay: y, bx: mx, by: my, thickness });
      segments.push({ ax: mx, ay: my, bx: endX, by: endY, thickness });

      // Flowers: twig endpoints + scatter along mid-branches + mid-branch endpoints
      if (depth === 0) {
        // Endpoint of a twig — always a flower
        flowers.push({ x: endX, y: endY, size: 0.012 });
      } else if (depth === 1) {
        // One scatter flower along the mid-branch
        const ft = 0.35 + Math.random() * 0.4;
        const fx = x + Math.cos(angle) * length * ft;
        const fy = y + Math.sin(angle) * length * ft;
        flowers.push({ x: fx, y: fy, size: 0.010 });
        // Also flower at the endpoint
        flowers.push({ x: endX, y: endY, size: 0.010 });
      }

      if (depth <= 0) return;

      const numBranches = depth === 1 ? 2 : 3;
      for (let i = 0; i < numBranches; i++) {
        const t = 0.25 + (i / numBranches) * 0.5;
        const subX = x + Math.cos(angle) * length * t;
        const subY = y + Math.sin(angle) * length * t;

        const spreadAngle = (i / (numBranches - 1)) - 0.5;
        const subAngle = angle + spreadAngle * 0.9 + (Math.random() - 0.5) * 0.3;
        const subLength = length * (0.6 + Math.random() * 0.15);
        const subThickness = thickness * (0.5 + Math.random() * 0.2);

        buildSegments(segments, flowers, subX, subY, subAngle, subLength, subThickness, depth - 1);
      }
    }

    function buildBranchSkeleton(cols, rows) {
      const segments = [];
      const flowers = [];

      const startX = -0.05;
      const startY = 0.98;
      const angle = -0.55;
      const length = 0.45;
      const thickness = 0.012;

      buildSegments(segments, flowers, startX, startY, angle, length, thickness, 2);

      return { segments, flowers };
    }

    function isBranch(col, row, cols, rows, segments) {
      const x = col / cols;
      const y = row / rows;

      for (const seg of segments) {
        const d = distToSegment(x, y, seg.ax, seg.ay, seg.bx, seg.by);
        if (d < seg.thickness) return true;
      }
      return false;
    }

    // Build a Map of "col,row" -> normalized distance from flower center (0=core, 1=edge)
    function buildFlowerMap(flowers, cols, rows) {
      const map = new Map();

      for (const f of flowers) {
        const centerCol = Math.round(f.x * cols);
        const centerRow = Math.round(f.y * rows);
        // Cluster radius in grid units (proportional to flower size)
        const radius = Math.max(1, Math.ceil(f.size * cols * 2));
        const r = radius + Math.floor(Math.random() * 2);

        // Form a roughly circular cluster
        for (let dr = -r; dr <= r; dr++) {
          for (let dc = -r; dc <= r; dc++) {
            const dist = Math.sqrt(dr * dr + dc * dc);
            if (dist <= r + 0.5) {
              const fc = centerCol + dc;
              const fr = centerRow + dr;
              if (fc >= 0 && fc < cols && fr >= 0 && fr < rows) {
                // ~70% density for a scattered blossom look
                if (Math.random() < 0.7) {
                  const key = `${fc},${fr}`;
                  const normDist = dist / Math.max(1, r);
                  // Keep the smallest distance (closest to center) if cell hits multiple flowers
                  if (!map.has(key) || normDist < map.get(key)) {
                    map.set(key, normDist);
                  }
                }
              }
            }
          }
        }
      }

      return map;
    }

    // ---------- Colors ----------

    function flowerColor(dist) {
      // dist: 0 = flower center (vibrant, deeper), 1 = outermost edge (lighter, softer)
      const t = Math.min(1, Math.max(0, dist));
      // Interpolate from deeper pink to lighter petal pink
      const baseR = Math.round(195 + t * 55);
      const baseG = Math.round(55 + t * 155);
      const baseB = Math.round(100 + t * 125);
      // Small random nuance per character for organic feel
      const jitter = 12;
      const r = baseR + Math.floor((Math.random() - 0.5) * jitter);
      const g = baseG + Math.floor((Math.random() - 0.5) * jitter);
      const b = baseB + Math.floor((Math.random() - 0.5) * jitter);
      return `rgb(${r},${g},${b})`;
    }

    // ---------- Clouds ----------

    function buildCloudSet(cols, rows) {
      const set = new Set();
      const numClouds = 3 + Math.floor(Math.random() * 3); // 3–5 clouds

      for (let c = 0; c < numClouds; c++) {
        // Cloud center in top portion of screen
        const cx = 0.05 + Math.random() * 0.9;  // 5%–95% horizontally
        const cy = 0.05 + Math.random() * 0.25; // 5%–30% from top
        const centerCol = Math.round(cx * cols);
        const centerRow = Math.round(cy * rows);

        // Ellipse radii: wider than tall
        const rx = Math.floor(cols * (0.06 + Math.random() * 0.10)); // 6%–16% of screen width
        const ry = Math.floor(rows * (0.03 + Math.random() * 0.04)); // 3%–7% of screen height
        const rxf = rx * rx;
        const ryf = ry * ry;

        for (let dr = -ry; dr <= ry; dr++) {
          for (let dc = -rx; dc <= rx; dc++) {
            // Ellipse check
            if ((dc * dc) / rxf + (dr * dr) / ryf <= 1.05) {
              const fc = centerCol + dc;
              const fr = centerRow + dr;
              if (fc >= 0 && fc < cols && fr >= 0 && fr < rows) {
                // ~80% density for puffy cloud look
                if (Math.random() < 0.8) {
                  set.add(`${fc},${fr}`);
                }
              }
            }
          }
        }
      }

      return set;
    }

    function cloudColor() {
      const r = Math.floor(Math.random() * 25 + 220); // 220–245
      const g = Math.floor(Math.random() * 25 + 225); // 225–250
      const b = Math.floor(Math.random() * 15 + 240); // 240–255
      return `rgb(${r},${g},${b})`;
    }

    function skyColor(row, rows) {
      // Blue gradient: deep saturated blue at top, lighter blue at bottom
      const t = rows > 1 ? row / (rows - 1) : 0;
      const r = Math.round(30 + t * 80);
      const g = Math.round(100 + t * 70);
      const b = Math.round(190 + t * 35);
      return `rgb(${r},${g},${b})`;
    }

    // ---------- Character Sets ----------
    // Branch: bold, structured, dense lines
    const BRANCH_CHARS = 'ABDEFHKMNPRTWXYZ14#$%&*+/<>@\\^|'.split('');
    // Flower: round, curved, decorative
    const FLOWER_CHARS = 'acegou*+~,\'.0689O'.split('');
    // Cloud: round, soft, puffy characters
    const CLOUD_CHARS = '.~,o0689Oaceu*'.split('');
    // Sky: ]-[ logo pattern (3 chars, no space)
    const SKY_CHARS = [']', '-', '['];

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // ---------- Rendering ----------

    function generateMatrix() {
      const cols = Math.ceil(window.innerWidth / CHAR_W);
      const rows = Math.ceil(window.innerHeight / CHAR_H);

      const { segments, flowers } = buildBranchSkeleton(cols, rows);
      const flowerMap = buildFlowerMap(flowers, cols, rows);
      const cloudSet = buildCloudSet(cols, rows);

      matrix.innerHTML = '';

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const span = document.createElement('span');
          span.className = 'char';  

          const key = `${col},${row}`;

          if (cloudSet.has(key)) {
            span.textContent = pick(CLOUD_CHARS);
            span.style.color = cloudColor();
          } else if (flowerMap.has(key)) {
            span.classList.add('flower');
            span.textContent = pick(FLOWER_CHARS);
            span.style.color = flowerColor(flowerMap.get(key));
          } else if (isBranch(col, row, cols, rows, segments)) {
            span.classList.add('branch');
            span.textContent = pick(BRANCH_CHARS);
          } else {
            span.textContent = SKY_CHARS[col % 3];
            span.style.color = skyColor(row, rows);
          }

          matrix.appendChild(span);
        }
      }
    }

    generateMatrix();
  </script>
</body>
</html>
