<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky & Branch ASCII</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #80b7e5 0%, #e8f2fa 100%);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #matrix {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      width: 100%;
      height: 100%;
      line-height: 1;
    }

    .char {
      font-family: monospace;
      font-size: 16px;
      display: inline-block;
      width: 9.6px;
      height: 16px;
      text-align: center;
    }

    .branch {
      font-weight: bold;
      color: #1a1a1a;
    }

    .flower {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="matrix"></div>

  <script>
    const matrix = document.getElementById('matrix');
    const CHAR_W = 9.6;
    const CHAR_H = 16;

    // ---------- Branch Skeleton ----------

    function distToSegment(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      const len2 = abx * abx + aby * aby;
      if (len2 === 0) return Math.sqrt(apx * apx + apy * apy);
      let t = (apx * abx + apy * aby) / len2;
      t = Math.max(0, Math.min(1, t));
      const cx = ax + t * abx;
      const cy = ay + t * aby;
      const dx = px - cx;
      const dy = py - cy;
      return Math.sqrt(dx * dx + dy * dy);
    }

    // Recursively build branch segments, also collect flower positions
    function buildSegments(segments, flowers, x, y, angle, length, thickness, depth) {
      if (thickness < 0.003 || length < 0.02) return;

      const endX = x + Math.cos(angle) * length;
      const endY = y + Math.sin(angle) * length;

      // Split segment at midpoint with a slight perpendicular offset for subtle curve
      const midX = (x + endX) / 2;
      const midY = (y + endY) / 2;
      // Tiny perpendicular offset — varies by angle for organic feel, scale by length
      const perpAngle = angle + Math.PI / 2;
      const offset = length * 0.03 * Math.sin(angle * 3 + depth);
      const mx = midX + Math.cos(perpAngle) * offset;
      const my = midY + Math.sin(perpAngle) * offset;

      segments.push({ ax: x, ay: y, bx: mx, by: my, thickness });
      segments.push({ ax: mx, ay: my, bx: endX, by: endY, thickness });

      // Flowers: twig endpoints + scatter along mid-branches + mid-branch endpoints
      if (depth === 0) {
        // Endpoint of a twig — always a flower
        flowers.push({ x: endX, y: endY, size: 0.012 });
      } else if (depth === 1) {
        // One scatter flower along the mid-branch
        const ft = 0.35 + Math.random() * 0.4;
        const fx = x + Math.cos(angle) * length * ft;
        const fy = y + Math.sin(angle) * length * ft;
        flowers.push({ x: fx, y: fy, size: 0.010 });
        // Also flower at the endpoint
        flowers.push({ x: endX, y: endY, size: 0.010 });
      }

      if (depth <= 0) return;

      const numBranches = depth === 1 ? 2 : 3;
      for (let i = 0; i < numBranches; i++) {
        const t = 0.25 + (i / numBranches) * 0.5;
        const subX = x + Math.cos(angle) * length * t;
        const subY = y + Math.sin(angle) * length * t;

        const spreadAngle = (i / (numBranches - 1)) - 0.5;
        const subAngle = angle + spreadAngle * 0.9 + (Math.random() - 0.5) * 0.3;
        const subLength = length * (0.6 + Math.random() * 0.15);
        const subThickness = thickness * (0.5 + Math.random() * 0.2);

        buildSegments(segments, flowers, subX, subY, subAngle, subLength, subThickness, depth - 1);
      }
    }

    function buildBranchSkeleton(cols, rows) {
      const segments = [];
      const flowers = [];

      const startX = -0.05;
      const startY = 0.98;
      const angle = -0.55;
      const length = 0.45;
      const thickness = 0.012;

      buildSegments(segments, flowers, startX, startY, angle, length, thickness, 2);

      return { segments, flowers };
    }

    function isBranch(col, row, cols, rows, segments) {
      const x = col / cols;
      const y = row / rows;

      for (const seg of segments) {
        const d = distToSegment(x, y, seg.ax, seg.ay, seg.bx, seg.by);
        if (d < seg.thickness) return true;
      }
      return false;
    }

    // Build a Map of "col,row" -> normalized distance from flower center (0=core, 1=edge)
    function buildFlowerMap(flowers, cols, rows) {
      const map = new Map();

      for (const f of flowers) {
        const centerCol = Math.round(f.x * cols);
        const centerRow = Math.round(f.y * rows);
        // Cluster radius in grid units (proportional to flower size)
        const radius = Math.max(1, Math.ceil(f.size * cols * 2));
        const r = radius + Math.floor(Math.random() * 2);

        // Form a roughly circular cluster
        for (let dr = -r; dr <= r; dr++) {
          for (let dc = -r; dc <= r; dc++) {
            const dist = Math.sqrt(dr * dr + dc * dc);
            if (dist <= r + 0.5) {
              const fc = centerCol + dc;
              const fr = centerRow + dr;
              if (fc >= 0 && fc < cols && fr >= 0 && fr < rows) {
                // ~70% density for a scattered blossom look
                if (Math.random() < 0.7) {
                  const key = `${fc},${fr}`;
                  const normDist = dist / Math.max(1, r);
                  // Keep the smallest distance (closest to center) if cell hits multiple flowers
                  if (!map.has(key) || normDist < map.get(key)) {
                    map.set(key, normDist);
                  }
                }
              }
            }
          }
        }
      }

      return map;
    }

    // ---------- Colors ----------

    function flowerColor(dist) {
      // dist: 0 = flower center (vibrant, deeper), 1 = outermost edge (lighter, softer)
      const t = Math.min(1, Math.max(0, dist));
      // Interpolate from deeper pink to lighter petal pink
      const baseR = Math.round(195 + t * 55);
      const baseG = Math.round(55 + t * 155);
      const baseB = Math.round(100 + t * 125);
      // Small random nuance per character for organic feel
      const jitter = 12;
      const r = baseR + Math.floor((Math.random() - 0.5) * jitter);
      const g = baseG + Math.floor((Math.random() - 0.5) * jitter);
      const b = baseB + Math.floor((Math.random() - 0.5) * jitter);
      return `rgb(${r},${g},${b})`;
    }

    // ---------- Clouds ----------

    function buildClouds(cols, rows) {
      const clouds = [];
      const numClouds = 3 + Math.floor(Math.random() * 3); // 3–5 clouds

      const cloudTop = 0;
      const cloudBot = Math.max(1, Math.floor(rows * 0.30));

      for (let c = 0; c < numClouds; c++) {
        const cx = 0.05 + Math.random() * 0.9;
        const cy = cloudTop + Math.random() * (cloudBot - cloudTop);
        const centerCol = Math.round(cx * cols);
        const centerRow = Math.round(cy);
        const rx = Math.floor(cols * (0.06 + Math.random() * 0.10));
        const ry = Math.floor(rows * (0.03 + Math.random() * 0.04));
        // Half move right, half move left
        const baseSpeed = 0.02 + Math.random() * 0.04;
        const speed = c % 2 === 0 ? baseSpeed : -baseSpeed;

        clouds.push({ centerCol, centerRow, rx, ry, speed, cells: new Set(), fracCol: 0 });
      }

      return clouds;
    }

    function getCloudCells(cloud, cols, rows) {
      // Retry until at least one cell is generated (prevents empty clouds)
      let cells;
      do {
        cells = new Set();
        const cc = Math.round(cloud.centerCol);
        const cr = Math.round(cloud.centerRow);
        const rxf = cloud.rx * cloud.rx;
        const ryf = cloud.ry * cloud.ry;

        for (let dr = -cloud.ry; dr <= cloud.ry; dr++) {
          for (let dc = -cloud.rx; dc <= cloud.rx; dc++) {
            if ((dc * dc) / rxf + (dr * dr) / ryf <= 1.05) {
              const fc = cc + dc;
              const fr = cr + dr;
              if (fc >= 0 && fc < cols && fr >= 0 && fr < rows) {
                // ~80% density
                if (Math.random() < 0.8) {
                  cells.add(`${fc},${fr}`);
                }
              }
            }
          }
        }
      } while (cells.size === 0);

      return cells;
    }

    function cloudColor() {
      const r = Math.floor(Math.random() * 25 + 220); // 220–245
      const g = Math.floor(Math.random() * 25 + 225); // 225–250
      const b = Math.floor(Math.random() * 15 + 240); // 240–255
      return `rgb(${r},${g},${b})`;
    }

    function skyColor(row, rows) {
      // Blue gradient: deep saturated blue at top, lighter blue at bottom
      const t = rows > 1 ? row / (rows - 1) : 0;
      const r = Math.round(30 + t * 80);
      const g = Math.round(100 + t * 70);
      const b = Math.round(190 + t * 35);
      return `rgb(${r},${g},${b})`;
    }

    // ---------- Dev Settings ----------
    const SHOW_LOGO = false;  // set to false for empty sky (no ]-[ pattern)

    // ---------- Character Sets ----------
    // Branch: bold, structured, dense lines
    const BRANCH_CHARS = 'ABDEFHKMNPRTWXYZ14#$%&*+/<>@\\^|'.split('');
    // Flower: round, curved, decorative
    const FLOWER_CHARS = 'acegou*+~,\'.0689O'.split('');
    // Cloud: round, soft, puffy characters
    const CLOUD_CHARS = '.~,?)(%Q&o0689OaceO3BC@'.split('');
    // Sky: ]-[ logo pattern (3 chars, no space)
    const SKY_CHARS = [']', '-', '['];

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    // ---------- Rendering ----------

    function generateMatrix() {
      const cols = Math.ceil(window.innerWidth / CHAR_W);
      const rows = Math.ceil(window.innerHeight / CHAR_H);

      const { segments, flowers } = buildBranchSkeleton(cols, rows);
      const flowerMap = buildFlowerMap(flowers, cols, rows);
      const clouds = buildClouds(cols, rows);

      // Build 2D grid: grid[row][col] = { span, type: 'sky'|'flower'|'branch'|'cloud' }
      const grid = [];
      for (let row = 0; row < rows; row++) {
        grid[row] = [];
      }

      // Initialize cloud cells
      for (const cloud of clouds) {
        cloud.cells = getCloudCells(cloud, cols, rows);
      }

      // Build a set of all cloud cells for fast lookup
      const allCloudCells = new Set();
      for (const cloud of clouds) {
        for (const key of cloud.cells) {
          allCloudCells.add(key);
        }
      }

      matrix.innerHTML = '';

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const span = document.createElement('span');
          span.className = 'char';  

          const key = `${col},${row}`;

          if (allCloudCells.has(key)) {
            span.textContent = pick(CLOUD_CHARS);
            span.style.color = cloudColor();
            grid[row][col] = { span, type: 'cloud' };
          } else if (flowerMap.has(key)) {
            span.classList.add('flower');
            span.textContent = pick(FLOWER_CHARS);
            span.style.color = flowerColor(flowerMap.get(key));
            grid[row][col] = { span, type: 'flower' };
          } else if (isBranch(col, row, cols, rows, segments)) {
            span.classList.add('branch');
            span.textContent = pick(BRANCH_CHARS);
            grid[row][col] = { span, type: 'branch' };
          } else {
            span.textContent = SHOW_LOGO ? SKY_CHARS[col % 3] : ' ';
            span.style.color = skyColor(row, rows);
            grid[row][col] = { span, type: 'sky' };
          }

          matrix.appendChild(span);
        }
      }

      return { grid, clouds, cols, rows };
    }

    const { grid, clouds, cols, rows } = generateMatrix();

    // ---------- Cloud Animation ----------

    // Restrict cloud vertical range to top 30% of screen to avoid branch/flower overlap
    const CLOUD_TOP_ROW = 0;
    const CLOUD_BOT_ROW = Math.max(1, Math.floor(rows * 0.30));
    const CLOUD_ROW_SPAN = CLOUD_BOT_ROW - CLOUD_TOP_ROW;

    function cloudRowToGridRow(fracY) {
      return Math.round(CLOUD_TOP_ROW + fracY * CLOUD_ROW_SPAN);
    }

    function setCellAsCloud(row, col) {
      if (row < 0 || row >= rows || col < 0 || col >= cols) return;
      const cell = grid[row][col];
      if (cell.type === 'flower' || cell.type === 'branch') return; // don't overwrite flowers/branches
      cell.type = 'cloud';
      cell.span.textContent = pick(CLOUD_CHARS);
      cell.span.style.color = cloudColor();
      cell.span.classList.remove('flower', 'branch');
    }

    function setCellAsSky(row, col) {
      if (row < 0 || row >= rows || col < 0 || col >= cols) return;
      const cell = grid[row][col];
      if (cell.type === 'flower' || cell.type === 'branch') return;
      cell.type = 'sky';
      cell.span.textContent = SHOW_LOGO ? SKY_CHARS[col % 3] : ' ';
      cell.span.style.color = skyColor(row, rows);
      cell.span.classList.remove('flower', 'branch');
    }

    // Redraw a cloud at its current position (clears old cells first)
    function redrawCloud(cloud) {
      // Clear old position
      for (const key of cloud.cells) {
        const [c, r] = key.split(',').map(Number);
        setCellAsSky(r, c);
      }
      cloud.cells.clear();

      // Calculate new cells at current centerCol/centerRow
      cloud.cells = getCloudCells(cloud, cols, rows);

      // Draw new position
      for (const key of cloud.cells) {
        const [c, r] = key.split(',').map(Number);
        setCellAsCloud(r, c);
      }
    }

    function removeCloud(cloud) {
      // Clear all cloud cells back to sky
      for (const key of cloud.cells) {
        const [c, r] = key.split(',').map(Number);
        setCellAsSky(r, c);
      }
      cloud.cells.clear();
    }

    function spawnCloud() {
      const speedDir = Math.random() < 0.5 ? 1 : -1;
      const baseSpeed = 0.02 + Math.random() * 0.04;
      const speed = speedDir * baseSpeed;
      const rx = Math.floor(cols * (0.06 + Math.random() * 0.10));
      const ry = Math.floor(rows * (0.03 + Math.random() * 0.04));
      const centerRow = cloudRowToGridRow(0.05 + Math.random() * 0.95);

      // Start just off-screen on the appropriate side
      const centerCol = speedDir > 0 ? -rx : cols + rx;

      const cloud = { centerCol, centerRow, rx, ry, speed, cells: new Set(), fracCol: 0 };
      cloud.cells = getCloudCells(cloud, cols, rows);

      // Draw new cloud
      for (const key of cloud.cells) {
        const [c, r] = key.split(',').map(Number);
        setCellAsCloud(r, c);
      }

      clouds.push(cloud);
    }

    // ---------- Animation Loop ----------
    const ANIM_SPEED_MS = 20; // interval in milliseconds — change to 400 for normal speed

    setInterval(() => {
      for (let i = clouds.length - 1; i >= 0; i--) {
        const cloud = clouds[i];

        // Accumulate fractional column movement
        cloud.fracCol += cloud.speed;

        // When enough fraction builds up, shift by a whole column
        const colShift = Math.trunc(cloud.fracCol);
        if (colShift !== 0) {
          cloud.centerCol += colShift;
          cloud.fracCol -= colShift;
          redrawCloud(cloud);
        }

        // Random character flicker: ~5% of cells change each tick
        const cloudCellKeys = Array.from(cloud.cells);
        if (cloudCellKeys.length > 0) {
          const changeCount = Math.max(1, Math.floor(cloudCellKeys.length * 0.05));
          for (let ci = 0; ci < changeCount; ci++) {
            const key = cloudCellKeys[Math.floor(Math.random() * cloudCellKeys.length)];
            const [c, r] = key.split(',').map(Number);
            if (r >= 0 && r < rows && c >= 0 && c < cols) {
              const cell = grid[r][c];
              if (cell.type === 'cloud') {
                cell.span.textContent = pick(CLOUD_CHARS);
              }
            }
          }
        }

        // Remove cloud if it has drifted fully off screen
        if (cloud.speed > 0 && cloud.centerCol - cloud.rx > cols) {
          removeCloud(cloud);
          clouds.splice(i, 1);
        } else if (cloud.speed < 0 && cloud.centerCol + cloud.rx < 0) {
          removeCloud(cloud);
          clouds.splice(i, 1);
        }
      }
    }, ANIM_SPEED_MS);

    // Periodically spawn new clouds (every 3-8 seconds)
    setInterval(() => {
      spawnCloud();
    }, 3000 + Math.random() * 5000);
  </script>
</body>
</html>
