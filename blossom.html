<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky & Branch ASCII</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #57addca8 0%, #faf4e8 100%);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #matrix {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      width: 100%;
      height: 100%;
      line-height: 1;
    }

    .char {
      font-family: monospace;
      font-size: 16px;
      display: inline-block;
      width: 9.6px;
      height: 16px;
      text-align: center;
    }

    .branch {
      font-weight: bold;
      color: #1a1a1a;
    }

    .flower {
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="matrix"></div>

  <script>
    const matrix = document.getElementById('matrix');
    const CHAR_W = 9.6;
    const CHAR_H = 16;

    let cols, rows;
    let grid = []; // 2D array: grid[row][col] = span element

    // ---------- Wind System ----------

    let windX = 0.8;
    let windY = 0.0;
    let windTargetX = 0.8;
    let windTargetY = 0.0;
    let windChangeTimer = 0;
    const WIND_CHANGE_MIN = 8;
    const WIND_CHANGE_MAX = 22;

    function updateWind(dt) {
      windChangeTimer -= dt;
      if (windChangeTimer <= 0) {
        windTargetX = (Math.random() - 0.35) * 2.2;
        windTargetY = (Math.random() - 0.5) * 0.7;
        windChangeTimer = WIND_CHANGE_MIN + Math.random() * (WIND_CHANGE_MAX - WIND_CHANGE_MIN);
      }
      const lerpSpeed = 0.25;
      windX += (windTargetX - windX) * lerpSpeed * dt;
      windY += (windTargetY - windY) * lerpSpeed * dt;
    }

    // ---------- Branch Skeleton ----------

    function distToSegment(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      const len2 = abx * abx + aby * aby;
      if (len2 === 0) return Math.sqrt(apx * apx + apy * apy);
      let t = (apx * abx + apy * aby) / len2;
      t = Math.max(0, Math.min(1, t));
      const cx = ax + t * abx;
      const cy = ay + t * aby;
      const dx = px - cx;
      const dy = py - cy;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function buildSegments(segments, flowers, x, y, angle, length, thickness, depth) {
      if (thickness < 0.003 || length < 0.02) return;
      const endX = x + Math.cos(angle) * length;
      const endY = y + Math.sin(angle) * length;
      const midX = (x + endX) / 2;
      const midY = (y + endY) / 2;
      const perpAngle = angle + Math.PI / 2;
      const offset = length * 0.03 * Math.sin(angle * 3 + depth);
      const mx = midX + Math.cos(perpAngle) * offset;
      const my = midY + Math.sin(perpAngle) * offset;
      segments.push({ ax: x, ay: y, bx: mx, by: my, thickness });
      segments.push({ ax: mx, ay: my, bx: endX, by: endY, thickness });
      if (depth === 0) {
        flowers.push({ x: endX, y: endY, size: 0.012 });
      } else if (depth === 1) {
        const ft = 0.35 + Math.random() * 0.4;
        flowers.push({ x: x + Math.cos(angle) * length * ft, y: y + Math.sin(angle) * length * ft, size: 0.010 });
        flowers.push({ x: endX, y: endY, size: 0.010 });
      }
      if (depth <= 0) return;
      const numBranches = depth === 1 ? 2 : 3;
      for (let i = 0; i < numBranches; i++) {
        const t = 0.25 + (i / numBranches) * 0.5;
        const subX = x + Math.cos(angle) * length * t;
        const subY = y + Math.sin(angle) * length * t;
        const spreadAngle = (i / (numBranches - 1)) - 0.5;
        const subAngle = angle + spreadAngle * 0.9 + (Math.random() - 0.5) * 0.3;
        const subLength = length * (0.6 + Math.random() * 0.15);
        const subThickness = thickness * (0.5 + Math.random() * 0.2);
        buildSegments(segments, flowers, subX, subY, subAngle, subLength, subThickness, depth - 1);
      }
    }

    function buildBranchSkeleton(cols, rows) {
      const segments = [];
      const flowers = [];
      buildSegments(segments, flowers, -0.05, 0.98, -0.55, 0.45, 0.012, 2);
      return { segments, flowers };
    }

    function isBranch(col, row, cols, rows, segments) {
      const x = col / cols;
      const y = row / rows;
      for (const seg of segments) {
        if (distToSegment(x, y, seg.ax, seg.ay, seg.bx, seg.by) < seg.thickness) return true;
      }
      return false;
    }

    function buildFlowerMap(flowers, cols, rows) {
      const map = new Map();
      for (const f of flowers) {
        const centerCol = Math.round(f.x * cols);
        const centerRow = Math.round(f.y * rows);
        const radius = Math.max(1, Math.ceil(f.size * cols * 2));
        const r = radius + Math.floor(Math.random() * 2);
        for (let dr = -r; dr <= r; dr++) {
          for (let dc = -r; dc <= r; dc++) {
            const dist = Math.sqrt(dr * dr + dc * dc);
            if (dist <= r + 0.5) {
              const fc = centerCol + dc;
              const fr = centerRow + dr;
              if (fc >= 0 && fc < cols && fr >= 0 && fr < rows && Math.random() < 0.7) {
                const key = `${fc},${fr}`;
                const normDist = dist / Math.max(1, r);
                if (!map.has(key) || normDist < map.get(key)) {
                  map.set(key, normDist);
                }
              }
            }
          }
        }
      }
      return map;
    }

    function flowerColor(dist) {
      const t = Math.min(1, Math.max(0, dist));
      const j = 12;
      return `rgb(${Math.round(195 + t * 55) + Math.floor((Math.random() - 0.5) * j)},${Math.round(55 + t * 155) + Math.floor((Math.random() - 0.5) * j)},${Math.round(100 + t * 125) + Math.floor((Math.random() - 0.5) * j)})`;
    }

    // ---------- Dev Settings ----------
    const SHOW_LOGO = true;

    // ---------- Character Sets ----------
    const BRANCH_CHARS = 'ABDEFHKMNPRTWXYZ14#$%&*+/<>@\\^|'.split('');
    const FLOWER_CHARS = 'acegou*+~,\'.0689O'.split('');
    const CLOUD_CHARS = '.~,o0689OaceCCCCOOOOOooooccc0000DD(((((())))))'.split('');
    const SKY_CHARS = [']', '-', '['];

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function randomCloudChar() {
      return pick(CLOUD_CHARS);
    }

    function cloudColor() {
      return `rgb(${220 + Math.floor(Math.random() * 25)},${225 + Math.floor(Math.random() * 25)},${240 + Math.floor(Math.random() * 15)})`;
    }

    function skyColor(row, rows) {
      const t = rows > 1 ? row / (rows - 1) : 0;
      const r = Math.round(30 + t * 80);
      const g = Math.round(100 + t * 70);
      const b = Math.round(190 + t * 35);
      return `rgb(${r},${g},${b})`;
    }

    // ---------- Background Rendering ----------

    function renderBackground() {
      cols = Math.ceil(window.innerWidth / CHAR_W);
      rows = Math.ceil(window.innerHeight / CHAR_H);
      const { segments, flowers } = buildBranchSkeleton(cols, rows);
      const flowerMap = buildFlowerMap(flowers, cols, rows);
      matrix.innerHTML = '';

      grid = [];
      for (let row = 0; row < rows; row++) {
        grid[row] = [];
        for (let col = 0; col < cols; col++) {
          const span = document.createElement('span');
          span.className = 'char';
          const key = `${col},${row}`;
          if (flowerMap.has(key)) {
            span.classList.add('flower');
            span.textContent = pick(FLOWER_CHARS);
            span.style.color = flowerColor(flowerMap.get(key));
            grid[row][col] = { span, type: 'flower' };
          } else if (isBranch(col, row, cols, rows, segments)) {
            span.classList.add('branch');
            span.textContent = pick(BRANCH_CHARS);
            grid[row][col] = { span, type: 'branch' };
          } else {
            span.textContent = SHOW_LOGO ? SKY_CHARS[col % 3] : ' ';
            span.style.color = skyColor(row, rows);
            grid[row][col] = { span, type: 'sky' };
          }
          matrix.appendChild(span);
        }
      }
    }

    // ---------- Cloud Object (Grid-integrated) ----------

    function buildCloudParticles(rx, ry) {
      const particles = [];
      const rxf = rx * rx;
      const ryf = ry * ry;

      for (let dr = -ry; dr <= ry; dr++) {
        for (let dc = -rx; dc <= rx; dc++) {
          if ((dc * dc) / rxf + (dr * dr) / ryf <= 1.05) {
            if (Math.random() < 0.8) {
              const phase = Math.random() * Math.PI * 2;
              const radius = Math.sqrt((dc * dc) / rxf + (dr * dr) / ryf);
              particles.push({
                char: randomCloudChar(),
                color: cloudColor(),
                phase,
                radius: Math.min(1, Math.max(0.05, radius)),
              });
            }
          }
        }
      }
      return particles;
    }

    function restoreCellToSky(col, row) {
      if (col < 0 || col >= cols || row < 0 || row >= rows) return;
      const cell = grid[row][col];
      if (!cell || cell.type === 'flower' || cell.type === 'branch') return;
      cell.type = 'sky';
      cell.span.textContent = SHOW_LOGO ? SKY_CHARS[col % 3] : ' ';
      cell.span.style.color = skyColor(row, rows);
      cell.span.classList.remove('flower', 'branch');
    }

    function setCellAsCloud(col, row, char, color) {
      if (col < 0 || col >= cols || row < 0 || row >= rows) return;
      const cell = grid[row][col];
      if (!cell || cell.type === 'flower' || cell.type === 'branch') return;
      cell.type = 'cloud';
      cell.span.textContent = char;
      cell.span.style.color = color;
      cell.span.classList.remove('flower', 'branch');
    }

    function createCloud(startOnScreen = false) {
      const rx = Math.max(2, Math.floor(cols * (0.06 + Math.random() * 0.10)));
      const ry = Math.max(2, Math.floor(rows * (0.03 + Math.random() * 0.04)));

      let particles = buildCloudParticles(rx, ry);

      const cloudPixelW = (rx * 2 + 1) * CHAR_W;

      const direction = Math.random() < 0.5 ? 1 : -1;
      const baseDrift = 25 + Math.random() * 25;

      const bobAmplitude = 1 + Math.random() * 2;
      const bobPeriod = 3.5 + Math.random() * 4;
      const bobPhase = Math.random() * Math.PI * 2;

      let startX;
      if (startOnScreen) {
        startX = cloudPixelW / 2 + Math.random() * (window.innerWidth - cloudPixelW);
      } else if (direction === 1) {
        startX = -(cloudPixelW + 10);
      } else {
        startX = window.innerWidth + 10;
      }

      const startY = (0.02 + Math.random() * 0.22) * window.innerHeight;

      const shimmerInterval = 1.5 + Math.random() * 3.5;

      const cloud = {
        x: startX,
        y: startY,
        direction,
        baseDrift,
        baseY: startY,
        bobAmplitude,
        bobPeriod,
        bobPhase,
        rx,
        ry,
        particles,
        occupiedCells: new Set(),
        morphTimer: 2 + Math.random() * 4,
        shimmerTimer: shimmerInterval * Math.random(),
        shimmerInterval,
      };

      // Initial draw
      drawCloudToGrid(cloud, 0);

      return cloud;
    }

    // Clear cloud's old cells and redraw at new position
    function drawCloudToGrid(cloud, timestamp) {
      // Clear old occupied cells
      for (const key of cloud.occupiedCells) {
        const [c, r] = key.split(',').map(Number);
        restoreCellToSky(c, r);
      }
      cloud.occupiedCells.clear();

      // Compute cloud center in grid coordinates
      const centerCol = Math.round(cloud.x / CHAR_W);
      const centerRow = Math.round(cloud.y / CHAR_H);

      // Place each particle
      for (const p of cloud.particles) {
        const dc = p.radius * cloud.rx * Math.cos(p.phase);
        const dr = p.radius * cloud.ry * Math.sin(p.phase);
        const col = Math.round(centerCol + dc);
        const row = Math.round(centerRow + dr);

        if (col >= 0 && col < cols && row >= 0 && row < rows) {
          const cell = grid[row][col];
          // Don't overwrite branch/flower
          if (cell && cell.type !== 'flower' && cell.type !== 'branch') {
            setCellAsCloud(col, row, p.char, p.color);
            cloud.occupiedCells.add(`${col},${row}`);
          }
        }
      }
    }

    // ---------- Cloud Morphing ----------

    function morphCloud(cloud) {
      if (cloud.particles.length === 0) return;

      const toRemove = 1 + Math.floor(Math.random() * 2);
      const actualRemove = Math.min(toRemove, cloud.particles.length);
      for (let i = 0; i < actualRemove; i++) {
        const idx = Math.floor(Math.random() * cloud.particles.length);
        cloud.particles.splice(idx, 1);
      }

      const toAdd = actualRemove;
      const rxf = cloud.rx * cloud.rx;
      const ryf = cloud.ry * cloud.ry;
      const maxAttempts = 50;

      for (let i = 0; i < toAdd; i++) {
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
          const dc = Math.floor(Math.random() * (cloud.rx * 2 + 1)) - cloud.rx;
          const dr = Math.floor(Math.random() * (cloud.ry * 2 + 1)) - cloud.ry;
          const ellipseDist = (dc * dc) / rxf + (dr * dr) / ryf;

          if (ellipseDist <= 1.05) {
            const phase = Math.atan2(dr / Math.max(1, cloud.ry), dc / Math.max(1, cloud.rx));
            const radius = Math.sqrt((dc * dc) / rxf + (dr * dr) / ryf);
            cloud.particles.push({
              char: randomCloudChar(),
              color: cloudColor(),
              phase,
              radius: Math.min(1, Math.max(0.05, radius)),
            });
            break;
          }
        }
      }

      cloud.morphTimer = 2 + Math.random() * 4;
    }

    // ---------- Cloud Spiral Animation ----------

    function updateSpiral(cloud, dt, windStrength) {
      const rotationSpeed = windStrength * 0.6;
      const outwardSpeed = 0.04;

      for (const p of cloud.particles) {
        p.phase += rotationSpeed * dt;
        p.radius += outwardSpeed * dt;

        if (p.radius > 1.0) {
          p.radius = 0.05 + Math.random() * 0.2;
          p.phase = Math.random() * Math.PI * 2;
        }
      }
    }

    // ---------- Cloud Shimmer ----------

    function shimmerCloud(cloud) {
      if (cloud.particles.length === 0) return;
      const numToUpdate = Math.max(1, Math.floor(cloud.particles.length * (0.1 + Math.random() * 0.1)));
      for (let i = 0; i < numToUpdate; i++) {
        const idx = Math.floor(Math.random() * cloud.particles.length);
        cloud.particles[idx].char = randomCloudChar();
        cloud.particles[idx].color = cloudColor();
      }
    }

    // Clean up a removed cloud — restore all its cells to sky
    function removeCloud(cloud) {
      for (const key of cloud.occupiedCells) {
        const [c, r] = key.split(',').map(Number);
        restoreCellToSky(c, r);
      }
      cloud.occupiedCells.clear();
    }

    // ---------- Animation ----------

    let clouds = [];
    let lastTime = null;
    const MAX_CLOUDS = 5;
    const MIN_SPAWN_DELAY = 3;
    const MAX_SPAWN_DELAY = 7;
    let spawnTimer = 0;
    let nextSpawnDelay = 0.3;

    function animate(timestamp) {
      if (lastTime === null) {
        lastTime = timestamp;
        requestAnimationFrame(animate);
        return;
      }

      let dt = (timestamp - lastTime) / 1000;
      if (dt > 0.2) dt = 0.2;
      lastTime = timestamp;

      updateWind(dt);
      const windStrength = Math.abs(windX);

      for (let i = clouds.length - 1; i >= 0; i--) {
        const cloud = clouds[i];

        // Move cloud
        cloud.x += cloud.direction * (cloud.baseDrift + windX * 15) * dt;
        cloud.y = cloud.baseY + Math.sin(timestamp / 1000 * (2 * Math.PI) / cloud.bobPeriod + cloud.bobPhase) * cloud.bobAmplitude;

        const cloudWidth = (cloud.rx * 2 + 1) * CHAR_W;
        const offLeft = cloud.x + cloudWidth < -20;
        const offRight = cloud.x - cloudWidth > window.innerWidth + 20;

        if (offLeft || offRight) {
          removeCloud(cloud);
          clouds.splice(i, 1);
        } else {
          updateSpiral(cloud, dt, windStrength);
          drawCloudToGrid(cloud, timestamp);

          cloud.morphTimer -= dt;
          if (cloud.morphTimer <= 0) {
            morphCloud(cloud);
          }

          cloud.shimmerTimer -= dt;
          if (cloud.shimmerTimer <= 0) {
            shimmerCloud(cloud);
            cloud.shimmerTimer = cloud.shimmerInterval;
          }
        }
      }

      spawnTimer += dt;
      if (spawnTimer >= nextSpawnDelay && clouds.length < MAX_CLOUDS) {
        clouds.push(createCloud(false));
        spawnTimer = 0;
        nextSpawnDelay = MIN_SPAWN_DELAY + Math.random() * (MAX_SPAWN_DELAY - MIN_SPAWN_DELAY);
      }

      requestAnimationFrame(animate);
    }

    // ---------- Init ----------

    function init() {
      for (const cloud of clouds) {
        removeCloud(cloud);
      }
      clouds = [];

      renderBackground();

      clouds.push(createCloud(true));
      clouds.push(createCloud(true));

      windX = 0.8;
      windY = 0.0;
      windTargetX = 0.8;
      windTargetY = 0.0;
      windChangeTimer = WIND_CHANGE_MIN + Math.random() * (WIND_CHANGE_MAX - WIND_CHANGE_MIN);

      nextSpawnDelay = MIN_SPAWN_DELAY + Math.random() * (MAX_SPAWN_DELAY - MIN_SPAWN_DELAY);
      spawnTimer = 0;
      lastTime = null;

      requestAnimationFrame(animate);
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(init, 200);
    });

    init();
  </script>
</body>
</html>
