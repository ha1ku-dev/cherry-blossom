<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky & Branch ASCII</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(to bottom, #9ad9ed 0%, #e8f2fa 100%);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #matrix {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #background {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      width: 100%;
      height: 100%;
      line-height: 1;
    }

    .char {
      font-family: monospace;
      font-size: 16px;
      display: inline-block;
      width: 9.6px;
      height: 16px;
      text-align: center;
    }

    .branch {
      font-weight: bold;
      color: #1a1a1a;
    }

    .flower {
      font-weight: bold;
    }

    .cloud-group {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
      will-change: transform;
    }

    .cloud-cell {
      font-family: monospace;
      font-size: 16px;
      display: inline-block;
      width: 9.6px;
      height: 16px;
      text-align: center;
      position: absolute;
    }
  </style>
</head>
<body>
  <div id="matrix">
    <div id="background"></div>
  </div>

  <script>
    const matrix = document.getElementById('matrix');
    const background = document.getElementById('background');
    const CHAR_W = 9.6;
    const CHAR_H = 16;

    let cols, rows;

    // ---------- Branch Skeleton ----------

    function distToSegment(px, py, ax, ay, bx, by) {
      const abx = bx - ax;
      const aby = by - ay;
      const apx = px - ax;
      const apy = py - ay;
      const len2 = abx * abx + aby * aby;
      if (len2 === 0) return Math.sqrt(apx * apx + apy * apy);
      let t = (apx * abx + apy * aby) / len2;
      t = Math.max(0, Math.min(1, t));
      const cx = ax + t * abx;
      const cy = ay + t * aby;
      const dx = px - cx;
      const dy = py - cy;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function buildSegments(segments, flowers, x, y, angle, length, thickness, depth) {
      if (thickness < 0.003 || length < 0.02) return;
      const endX = x + Math.cos(angle) * length;
      const endY = y + Math.sin(angle) * length;
      const midX = (x + endX) / 2;
      const midY = (y + endY) / 2;
      const perpAngle = angle + Math.PI / 2;
      const offset = length * 0.03 * Math.sin(angle * 3 + depth);
      const mx = midX + Math.cos(perpAngle) * offset;
      const my = midY + Math.sin(perpAngle) * offset;
      segments.push({ ax: x, ay: y, bx: mx, by: my, thickness });
      segments.push({ ax: mx, ay: my, bx: endX, by: endY, thickness });
      if (depth === 0) {
        flowers.push({ x: endX, y: endY, size: 0.012 });
      } else if (depth === 1) {
        const ft = 0.35 + Math.random() * 0.4;
        flowers.push({ x: x + Math.cos(angle) * length * ft, y: y + Math.sin(angle) * length * ft, size: 0.010 });
        flowers.push({ x: endX, y: endY, size: 0.010 });
      }
      if (depth <= 0) return;
      const numBranches = depth === 1 ? 2 : 3;
      for (let i = 0; i < numBranches; i++) {
        const t = 0.25 + (i / numBranches) * 0.5;
        const subX = x + Math.cos(angle) * length * t;
        const subY = y + Math.sin(angle) * length * t;
        const spreadAngle = (i / (numBranches - 1)) - 0.5;
        const subAngle = angle + spreadAngle * 0.9 + (Math.random() - 0.5) * 0.3;
        const subLength = length * (0.6 + Math.random() * 0.15);
        const subThickness = thickness * (0.5 + Math.random() * 0.2);
        buildSegments(segments, flowers, subX, subY, subAngle, subLength, subThickness, depth - 1);
      }
    }

    function buildBranchSkeleton(cols, rows) {
      const segments = [];
      const flowers = [];
      buildSegments(segments, flowers, -0.05, 0.98, -0.55, 0.45, 0.012, 2);
      return { segments, flowers };
    }

    function isBranch(col, row, cols, rows, segments) {
      const x = col / cols;
      const y = row / rows;
      for (const seg of segments) {
        if (distToSegment(x, y, seg.ax, seg.ay, seg.bx, seg.by) < seg.thickness) return true;
      }
      return false;
    }

    function buildFlowerMap(flowers, cols, rows) {
      const map = new Map();
      for (const f of flowers) {
        const centerCol = Math.round(f.x * cols);
        const centerRow = Math.round(f.y * rows);
        const radius = Math.max(1, Math.ceil(f.size * cols * 2));
        const r = radius + Math.floor(Math.random() * 2);
        for (let dr = -r; dr <= r; dr++) {
          for (let dc = -r; dc <= r; dc++) {
            const dist = Math.sqrt(dr * dr + dc * dc);
            if (dist <= r + 0.5) {
              const fc = centerCol + dc;
              const fr = centerRow + dr;
              if (fc >= 0 && fc < cols && fr >= 0 && fr < rows && Math.random() < 0.7) {
                const key = `${fc},${fr}`;
                const normDist = dist / Math.max(1, r);
                if (!map.has(key) || normDist < map.get(key)) {
                  map.set(key, normDist);
                }
              }
            }
          }
        }
      }
      return map;
    }

    function flowerColor(dist) {
      const t = Math.min(1, Math.max(0, dist));
      const j = 12;
      return `rgb(${Math.round(195 + t * 55) + Math.floor((Math.random() - 0.5) * j)},${Math.round(55 + t * 155) + Math.floor((Math.random() - 0.5) * j)},${Math.round(100 + t * 125) + Math.floor((Math.random() - 0.5) * j)})`;
    }

    // ---------- Character Sets ----------
    const BRANCH_CHARS = 'ABDEFHKMNPRTWXYZ14#$%&*+/<>@\\^|'.split('');
    const FLOWER_CHARS = 'acegou*+~,\'.0689O'.split('');
    const CLOUD_CHARS = '.~,o0689Oaceu*'.split('');

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function cloudColor() {
      return `rgb(${220 + Math.floor(Math.random() * 25)},${225 + Math.floor(Math.random() * 25)},${240 + Math.floor(Math.random() * 15)})`;
    }

    // ---------- Background Rendering ----------

    function renderBackground() {
      cols = Math.ceil(window.innerWidth / CHAR_W);
      rows = Math.ceil(window.innerHeight / CHAR_H);
      const { segments, flowers } = buildBranchSkeleton(cols, rows);
      const flowerMap = buildFlowerMap(flowers, cols, rows);
      background.innerHTML = '';

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const span = document.createElement('span');
          span.className = 'char';
          const key = `${col},${row}`;
          if (flowerMap.has(key)) {
            span.classList.add('flower');
            span.textContent = pick(FLOWER_CHARS);
            span.style.color = flowerColor(flowerMap.get(key));
          } else if (isBranch(col, row, cols, rows, segments)) {
            span.classList.add('branch');
            span.textContent = pick(BRANCH_CHARS);
          }
          background.appendChild(span);
        }
      }
    }

    // ---------- Cloud Object ----------

    function buildCloudShape(rx, ry) {
      // Guard against zero radius (prevents division by zero)
      if (rx < 1) rx = 1;
      if (ry < 1) ry = 1;
      const cells = new Set();
      const rxf = rx * rx;
      const ryf = ry * ry;
      for (let dr = -ry; dr <= ry; dr++) {
        for (let dc = -rx; dc <= rx; dc++) {
          if ((dc * dc) / rxf + (dr * dr) / ryf <= 1.05) {
            if (Math.random() < 0.8) {
              cells.add(`${dc},${dr}`);
            }
          }
        }
      }
      return cells;
    }

    function createCloud(startOnScreen = false) {
      const rx = Math.max(2, Math.floor(cols * (0.06 + Math.random() * 0.10)));
      const ry = Math.max(2, Math.floor(rows * (0.03 + Math.random() * 0.04)));

      let shape = buildCloudShape(rx, ry);

      const cloudPixelW = rx * CHAR_W * 2;

      // Direction: left-to-right or right-to-left
      const direction = Math.random() < 0.5 ? 1 : -1;

      // Speed: 0.5–1.5 px/s (barely noticeable drift)
      const baseSpeed = 0.5 + Math.random() * 1.0;
      const speed = baseSpeed * direction * (0.95 + Math.random() * 0.1);

      // Spawn position: on-screen for initial clouds, off-screen for new arrivals
      let startX;
      if (startOnScreen) {
        // Random visible position, fully within viewport
        startX = cloudPixelW / 2 + Math.random() * (window.innerWidth - cloudPixelW);
      } else if (direction === 1) {
        startX = -(cloudPixelW + 10);  // Enter from left
      } else {
        startX = window.innerWidth + 10; // Enter from right
      }

      const startY = (0.05 + Math.random() * 0.25) * window.innerHeight;

      // Per-cloud shimmer interval (randomized per cloud, slow and subtle)
      const shimmerInterval = 1.5 + Math.random() * 3.5;

      const container = document.createElement('div');
      container.className = 'cloud-group';
      container.style.transform = `translate(${startX}px, ${startY}px)`;
      matrix.appendChild(container);

      const cloud = {
        container,
        x: startX,
        y: startY,
        speed,
        rx,
        ry,
        shape,
        cells: new Map(),
        morphTimer: 2 + Math.random() * 4,
        shimmerTimer: shimmerInterval * Math.random(), // stagger start
        shimmerInterval,
      };

      // Create spans for current shape
      for (const key of cloud.shape) {
        const [dc, dr] = key.split(',').map(Number);
        const span = document.createElement('span');
        span.className = 'cloud-cell';
        span.textContent = pick(CLOUD_CHARS);
        span.style.color = cloudColor();
        span.style.left = `${(cloud.rx + dc) * CHAR_W}px`;
        span.style.top = `${(cloud.ry + dr) * CHAR_H}px`;
        container.appendChild(span);
        cloud.cells.set(key, span);
      }

      return cloud;
    }

    // ---------- Cloud Morphing ----------
    // Add/remove a few cells near the cloud's edge for subtle shape breathing

    function morphCloud(cloud) {
      if (cloud.shape.size === 0) return;

      // Find "edge" cells: cells that have at least one empty neighbor
      const edgeCandidates = [];
      const shapeArr = Array.from(cloud.shape);
      const neighborOffsets = [[1, 0], [-1, 0], [0, 1], [0, -1]];

      for (const key of shapeArr) {
        const [dc, dr] = key.split(',').map(Number);
        let emptyNeighbors = 0;
        for (const [ndc, ndr] of neighborOffsets) {
          if (!cloud.shape.has(`${dc + ndc},${dr + ndr}`)) {
            emptyNeighbors++;
          }
        }
        if (emptyNeighbors > 0) {
          edgeCandidates.push({ key, dc, dr });
        }
      }

      // Find potential new cells: empty cells adjacent to edge cells
      const expansionCandidates = new Set();
      for (const { dc, dr } of edgeCandidates) {
        for (const [ndc, ndr] of neighborOffsets) {
          const nk = `${dc + ndc},${dr + ndr}`;
          if (!cloud.shape.has(nk)) {
            expansionCandidates.add(nk);
          }
        }
      }

      // Remove 2–5 edge cells
      const toRemove = Math.min(edgeCandidates.length, 2 + Math.floor(Math.random() * 4));
      for (let i = 0; i < toRemove && edgeCandidates.length > 0; i++) {
        const idx = Math.floor(Math.random() * edgeCandidates.length);
        const { key } = edgeCandidates.splice(idx, 1)[0];
        cloud.shape.delete(key);
        const span = cloud.cells.get(key);
        if (span) {
          span.remove();
          cloud.cells.delete(key);
        }
      }

      // Add 1–3 new cells from expansion candidates
      const expArr = Array.from(expansionCandidates);
      const toAdd = Math.min(expArr.length, 1 + Math.floor(Math.random() * 3));
      for (let i = 0; i < toAdd && expArr.length > 0; i++) {
        const idx = Math.floor(Math.random() * expArr.length);
        const key = expArr.splice(idx, 1)[0];
        const [dc, dr] = key.split(',').map(Number);
        cloud.shape.add(key);
        const span = document.createElement('span');
        span.className = 'cloud-cell';
        span.textContent = pick(CLOUD_CHARS);
        span.style.color = cloudColor();
        span.style.left = `${(cloud.rx + dc) * CHAR_W}px`;
        span.style.top = `${(cloud.ry + dr) * CHAR_H}px`;
        cloud.container.appendChild(span);
        cloud.cells.set(key, span);
      }

      cloud.morphTimer = 2 + Math.random() * 4;
    }

    // ---------- Cloud Shimmer ----------

    function shimmerCloud(cloud) {
      // Pick ~10–20% of cloud cells to update
      const cellKeys = Array.from(cloud.cells.keys());
      if (cellKeys.length === 0) return;
      const numToUpdate = Math.max(1, Math.floor(cellKeys.length * (0.1 + Math.random() * 0.1)));
      for (let i = 0; i < numToUpdate; i++) {
        const key = cellKeys[Math.floor(Math.random() * cellKeys.length)];
        const span = cloud.cells.get(key);
        if (span) {
          span.textContent = pick(CLOUD_CHARS);
          span.style.color = cloudColor();
        }
      }
    }

    // ---------- Animation ----------

    let clouds = [];
    let lastTime = null;
    const MAX_CLOUDS = 5;
    const MIN_SPAWN_DELAY = 3;
    const MAX_SPAWN_DELAY = 7;
    let spawnTimer = 0;
    let nextSpawnDelay = 0.3; // first new cloud spawns quickly after init

    function animate(timestamp) {
      if (lastTime === null) {
        lastTime = timestamp;
        requestAnimationFrame(animate);
        return;
      }

      let dt = (timestamp - lastTime) / 1000;
      if (dt > 0.2) dt = 0.2;
      lastTime = timestamp;

      for (let i = clouds.length - 1; i >= 0; i--) {
        const cloud = clouds[i];

        // Move
        cloud.x += cloud.speed * dt;
        cloud.container.style.transform = `translate(${cloud.x}px, ${cloud.y}px)`;

        const cloudWidth = cloud.rx * CHAR_W * 2;
        const offLeft = cloud.x + cloudWidth < -20;
        const offRight = cloud.x - cloudWidth > window.innerWidth + 20;

        if (offLeft || offRight) {
          cloud.container.remove();
          clouds.splice(i, 1);
        } else {
          // Morph timer
          cloud.morphTimer -= dt;
          if (cloud.morphTimer <= 0) {
            morphCloud(cloud);
          }

          // Per-cloud shimmer timer
          cloud.shimmerTimer -= dt;
          if (cloud.shimmerTimer <= 0) {
            shimmerCloud(cloud);
            cloud.shimmerTimer = cloud.shimmerInterval;
          }
        }
      }

      // Spawn new clouds
      spawnTimer += dt;
      if (spawnTimer >= nextSpawnDelay && clouds.length < MAX_CLOUDS) {
        clouds.push(createCloud());
        spawnTimer = 0;
        nextSpawnDelay = MIN_SPAWN_DELAY + Math.random() * (MAX_SPAWN_DELAY - MIN_SPAWN_DELAY);
      }

      requestAnimationFrame(animate);
    }

    // ---------- Init ----------

    function init() {
      // Clean up old cloud containers
      for (const cloud of clouds) {
        cloud.container.remove();
      }
      clouds = [];

      renderBackground();

      // Seed with 2 clouds on-screen immediately
      clouds.push(createCloud(true));
      clouds.push(createCloud(true));

      nextSpawnDelay = MIN_SPAWN_DELAY + Math.random() * (MAX_SPAWN_DELAY - MIN_SPAWN_DELAY);
      spawnTimer = 0;
      shimmerTimer = 0;
      lastTime = null;

      requestAnimationFrame(animate);
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(init, 200);
    });

    init();
  </script>
</body>
</html>
